apiVersion: v1
kind: ConfigMap
metadata:
  name: kb-api
  labels: {{- include "kb-api.labels" . | nindent 4 }}
data:
  {{- if .Values.access.enabled }}
  ALLOWED_EMAILS: {{ join "," .Values.access.allowedEmails | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
