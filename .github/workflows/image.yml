name: image
on:
  push:
    branches: [main]
    # The tag-bump commit below only touches values.yaml; don't rebuild for it (GITHUB_TOKEN pushes don't retrigger anyway).
    paths-ignore: ['deploy/helm/kb-api/values.yaml', 'deploy/argocd/**', '**.md']
  workflow_dispatch:
concurrency: { group: image, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Argo CD deploys whatever tag is in git: pin the chart to this build.
      - name: Bump chart image tag
        env: { SHA: "${{ github.sha }}" }
        run: |
          yq -i '.image.tag = strenv(SHA)' deploy/helm/kb-api/values.yaml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: kb-api ${SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
