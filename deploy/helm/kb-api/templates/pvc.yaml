# Never let Helm or an Argo CD prune delete these.
# kb-data: the data repo clone.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kb-data
  labels: {{- include "kb-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.persistence.repo.size }} } }
  {{- with .Values.persistence.repo.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
# kb-state: jobs.sqlite + kb.sqlite (note index) + staging inbox. Must be on storage with real file locks (not NFS).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kb-state
  labels: {{- include "kb-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.persistence.state.size }} } }
  {{- with .Values.persistence.state.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
