# Register once: kubectl apply -n argocd -f deploy/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kb-api
  namespace: tomorrow
spec:
  project: default
  source:
    repoURL: https://github.com/sogaani/my-knowledge-app.git
    targetRevision: main
    path: deploy/helm/kb-api
    helm:
      releaseName: kb-api
  destination:
    server: https://kubernetes.default.svc
    namespace: my-knowledge
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
