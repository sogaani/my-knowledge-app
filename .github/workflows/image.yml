name: image
on:
  push:
    branches: [main]
    # The tag-bump commit below only touches values.yaml; don't rebuild for it (GITHUB_TOKEN pushes don't retrigger anyway).
    paths-ignore: ['deploy/helm/kb-api/values.yaml', 'deploy/argocd/**', '**.md']
  workflow_dispatch:
# One build at a time per branch; a run that is still queued is replaced by a newer push (the newest SHA wins).
concurrency: { group: "image-${{ github.ref }}", cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Argo CD deploys whatever tag is in git: pin the chart to this build.
      # The bump is applied on top of the *current* main (not the checked-out SHA): the previous run's bump touched
      # the same line, so rebasing an old-based commit onto it conflicts. On a rejected push, refetch and redo.
      - name: Bump chart image tag
        env: { SHA: "${{ github.sha }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main
            yq -i '.image.tag = strenv(SHA)' deploy/helm/kb-api/values.yaml
            git diff --quiet && { echo "already at ${SHA::7}"; exit 0; }
            git commit --quiet -am "deploy: kb-api ${SHA::7} [skip ci]"
            git push origin HEAD:main && exit 0
            echo "push rejected (attempt $attempt), retrying on the new main"
            sleep $((attempt * 5))
          done
          exit 1
