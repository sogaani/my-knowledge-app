image:
  repository: ghcr.io/sogaani/my-knowledge-app
  # Rewritten to the commit sha by .github/workflows/image.yml on every push to main; Argo CD rolls it out.
  tag: 59cb2c65f11e220399b7e7bf8aaa1e370da2e3db
  pullPolicy: IfNotPresent
imagePullSecrets: [] # e.g. [{ name: ghcr }] if the GHCR package is private
ingress:
  enabled: true
  className: cloudflare-tunnel
  host: kb.wanawata.com
persistence:
  # Both volumes are Longhorn block volumes (ext4, 3 replicas): real file locks, so SQLite works, and the Pod can move
  # between nodes. (Before 2026-10-19: kb-data on nfs-client, kb-state on local-path because NFS lacked SQLite locks.)
  # /data: git clone of the data repo.
  repo:
    size: 5Gi
    storageClass: longhorn
  # /data/app: jobs.sqlite + kb.sqlite (note index, refreshed incrementally across restarts) + staging inbox.
  state:
    size: 1Gi
    storageClass: longhorn
# Cloudflare Access app + worker service token, managed by cloudflare-zero-trust-operator.
access:
  enabled: true
  appName: my-knowledge
  # Only these Google accounts get in (Access policy and the API's own ALLOWED_EMAILS check).
  allowedEmails: [soga.ani@gmail.com]
  allowedIdps: [] # IdP ids; empty = every login method in the account
  autoRedirectToIdentity: false # true needs exactly one entry in allowedIdps
  sessionDuration: 24h
  # CloudflareServiceToken for the Mac worker; the operator writes Secret <name> (cloudflareClientId / cloudflareSecretKey).
  serviceTokenName: kb-worker
  # Keep the Cloudflare objects if the CRs are deleted (an Argo prune must not unprotect the app or rotate the token).
  preventDestroy: true
# Created out of band (see deploy/README.md). The chart only references them.
secrets:
  api: kb-api # WORKER_TOKEN, CF_ACCESS_AUD, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY (Web Push; optional, see README §1)
  git: kb-git # deploy_key
  gitCrypt: kb-git-crypt # key
config:
  KB_GIT_URL: "git@github.com:sogaani/my-knowledge.git"
  KB_GIT_BRANCH: "main"
  CF_ACCESS_TEAM_DOMAIN: "sogaani.cloudflareaccess.com"
  GIT_AUTHOR: "kb-web <kb-web@local>"
  SYNC_INTERVAL_SEC: "300"
  # The pod has no Ollama/LanceDB index: never embed here; semantic search is delegated to the Mac worker.
  KB_EMBED: "off"
  SEARCH_TIMEOUT_MS: "8000"
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}
